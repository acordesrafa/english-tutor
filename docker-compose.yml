version: "3.8"

services:
  english-tutor:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - tutor-data:/app/data
    environment:
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - TUTOR_DB=/app/data/tutor.db
    restart: unless-stopped
    # Oracle Cloud: use ARM-compatible image
    platform: linux/arm64

volumes:
  tutor-data: